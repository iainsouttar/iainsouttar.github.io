<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-UK' }}">



<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/writing.css' | relative_url }}">
</head>

<body>
  <main class="essay-container">

    <p>
      <a href="/writing/">Back to writing</a>
    </p>

    <h1>{{ page.title }}</h1>

    {% if page.date %}
      <p class="essay-date">
        {{ page.date | date: "%d %B %Y" }}
      </p>
    {% endif %}

    
   {% if page.audio %}
    <hr class="essay-divider">

    <p class="listen-label">
    Listen to my amateurish narration of this piece {% if page.duration %} ({{ page.duration }}){% endif %}
    </p>

    <audio controls preload="none">
    <source src="{{ '/assets/audio/' | append: page.audio | relative_url }}" type="audio/mpeg">
    </audio>
    <hr class="essay-divider">

    {% endif %}



    {{ content }}

  </main>

  <script data-goatcounter="https://iainswebpage.goatcounter.com/count"
      async src="//gc.zgo.at/count.js"></script>
</body>
</html>
